<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071018"><link rel="manifest" href="/manifest.webmanifest"><title>PROMBARJIN Ω</title><style>body{margin:0;background:#071018;color:#eaf4f5;font-family:system-ui,Arial}.shell{max-width:900px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}.status{border:1px solid #376b73;border-radius:99px;padding:7px 12px;font-size:12px}.panel{background:#0b1820;border:1px solid #173640;border-radius:18px;padding:16px;margin:14px 0}.chat{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:10px}.msg{padding:12px;border-radius:14px;white-space:pre-wrap}.user{background:#123443}.assistant{background:#0d202a;border:1px solid #183d49}.row{display:flex;gap:8px}.row>*{flex:1}textarea,input,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #244751;background:#08131a;color:#effafa}button{background:#d7f1f0;color:#062026;font-weight:800}pre{white-space:pre-wrap;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.chat{height:52vh}}small{opacity:.65}</style></head><body><main class="shell"><header><div><small>OMEGA ENTERPRISE X</small><h1>PROMBARJIN</h1><div>منصة ذكاء متصلة بالإنترنت</div></div><div class="status">ONLINE</div></header><section class="grid"><div class="panel"><b>السوق اللحظي</b><div class="row" style="margin-top:10px"><input id="symbol" value="AAPL"><button id="quote">LIVE QUOTE</button></div><pre id="quoteOut">—</pre></div><div class="panel"><b>الحالة</b><pre id="health">جاري الفحص...</pre></div></section><section class="panel"><div id="chat" class="chat"></div><div class="row" style="margin-top:10px"><textarea id="input" placeholder="اطلب تحليلًا، بحثًا، قرارًا أو خطة..."></textarea><button id="send">EXECUTE</button></div></section><small>D1 ذاكرة دائمة • Internet • Market Gateway • PWA</small></main><script>const chat=document.querySelector('#chat'),input=document.querySelector('#input'),send=document.querySelector('#send');function add(role,text){let d=document.createElement('div');d.className='msg '+role;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function exec(){let m=input.value.trim();if(!m)return;add('user',m);input.value='';send.disabled=true;try{let r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:m})});let j=await r.json();add('assistant',j.reply)}catch(e){add('assistant','خطأ اتصال: '+e)}send.disabled=false}send.onclick=exec;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))exec()});document.querySelector('#quote').onclick=async()=>{let s=document.querySelector('#symbol').value.trim();let r=await fetch('/api/market/quote?symbol='+encodeURIComponent(s));document.querySelector('#quoteOut').textContent=JSON.stringify(await r.json(),null,2)};fetch('/health').then(r=>r.json()).then(j=>document.querySelector('#health').textContent=JSON.stringify(j,null,2));</script></body></html>
