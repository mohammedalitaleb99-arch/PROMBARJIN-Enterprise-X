name: Build PROMBARJIN Android APK V2 - Ready

on:
  workflow_dispatch:

concurrency:
  group: prombarjin-android-v2
  cancel-in-progress: true

jobs:
  build-apk-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android platform/build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Prepare self-contained Android web bundle
        run: |
          set -euo pipefail
          rm -rf mobile/www
          mkdir -p mobile/www
          cp -R static/. mobile/www/
          cp mobile/v2-app.js mobile/www/app.js
          cat > mobile/capacitor.config.json <<'EOF'
          {
            "appId": "com.prombarjin.omegaenterprise.v2",
            "appName": "PROMBARJIN Ω Enterprise X",
            "webDir": "www",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          test -s mobile/www/index.html
          test -s mobile/www/app.js
          test -s mobile/www/app.css
          ! grep -R "127.0.0.1:8000" mobile/www mobile/capacitor.config.json
          grep -F "com.prombarjin.omegaenterprise.v2" mobile/capacitor.config.json
          grep -F "prombarjin-enterprise-x.onrender.com" mobile/www/app.js
          echo "V2 web bundle preflight OK"

      - name: Create Android project
        working-directory: mobile
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Verify generated Android identity and bundled assets
        run: |
          set -euo pipefail
          test -f mobile/android/app/src/main/AndroidManifest.xml
          grep -R "com.prombarjin.omegaenterprise.v2" mobile/android/app/src/main mobile/android/app/build.gradle
          test -f mobile/android/app/src/main/assets/public/index.html
          test -f mobile/android/app/src/main/assets/public/app.js
          test -f mobile/android/app/src/main/assets/public/app.css
          echo "Android identity and bundled asset checks OK"

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate APK completely
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" > /tmp/apk-badging.txt
          grep -F "package: name='com.prombarjin.omegaenterprise.v2'" /tmp/apk-badging.txt
          grep -F "launchable-activity" /tmp/apk-badging.txt
          "$APKSIGNER" verify --verbose "$APK"
          unzip -l "$APK" | grep -E "assets/public/(index\.html|app\.js|app\.css)" >/dev/null
          mkdir -p dist
          cp "$APK" dist/PROMBARJIN-OMEGA-ENTERPRISE-X-v2-debug.apk
          sha256sum dist/PROMBARJIN-OMEGA-ENTERPRISE-X-v2-debug.apk | tee dist/SHA256SUMS.txt
          echo "APK validation complete"

      - name: Upload ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROMBARJIN-OMEGA-ENTERPRISE-X-v2-ready
          path: dist/*
          if-no-files-found: error
