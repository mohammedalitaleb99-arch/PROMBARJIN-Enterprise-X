name: PROMBARJIN Ω Enterprise X v3 Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'static/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Bundle web app
        run: |
          rm -rf mobile/www
          mkdir -p mobile/www
          cp -R static/. mobile/www/
      - name: Generate Android
        working-directory: mobile
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android
      - name: Verify package identity
        run: grep -R "com.prombarjin.omegaenterprise.v3" mobile/android/app/src/main mobile/android/app/build.gradle
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Validate APK
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.prombarjin.omegaenterprise.v3'"
      - uses: actions/upload-artifact@v4
        with:
          name: PROMBARJIN-OMEGA-ENTERPRISE-X-v3
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
