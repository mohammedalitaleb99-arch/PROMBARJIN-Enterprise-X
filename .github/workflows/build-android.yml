name: Build PROMBARJIN Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'static/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform/build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Verify Capacitor toolchain
        working-directory: mobile
        run: |
          node --version
          npm --version
          npx tsc --version
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('capacitor.config.json','utf8')); console.log('Capacitor JSON config OK')"
          npx cap --version

      - name: Prepare web assets
        run: |
          rm -rf mobile/www
          mkdir -p mobile/www
          cp -R static/. mobile/www/
          test -s mobile/www/index.html
          test -s mobile/www/app.js
          test -s mobile/www/app.css
          echo "Bundled web UI preflight OK"

      - name: Create Android project
        working-directory: mobile
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Verify generated Android app identity
        run: |
          test -f mobile/android/app/src/main/AndroidManifest.xml
          grep -R "com.prombarjin.omegaenterprise.v2" mobile/android/app/src/main mobile/android/app/build.gradle
          echo "Android package identity verified"

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate APK artifact
        run: |
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT_OUT="$(./mobile/android/build-tools/35.0.0/aapt dump badging "$APK" 2>/dev/null || true)"
          echo "$AAPT_OUT" | grep -F "package: name='com.prombarjin.omegaenterprise.v2'"
          echo "$AAPT_OUT" | grep -F "launchable-activity"
          echo "APK integrity and package checks OK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROMBARJIN-OMEGA-ENTERPRISE-X-Android-debug-v2
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
