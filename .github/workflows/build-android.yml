name: Build PROMBARJIN Ω Enterprise X v3

on:
  workflow_dispatch:
  push:
    branches: [main, offline-reconciliation-v1]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'mobile/**'
      - 'static/**'
      - 'requirements.txt'
      - '.github/workflows/build-android.yml'

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest -q
      - name: Security preflight
        run: |
          ! grep -R "OPENAI_API_KEY\s*=\s*['\"]sk-" -n app mobile static || true
          ! grep -R "sk-[A-Za-z0-9]" -n app mobile static || true

  build-apk:
    needs: backend-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Prepare web assets
        run: |
          rm -rf mobile/www
          mkdir -p mobile/www
          cp -R static/. mobile/www/
          test -s mobile/www/index.html
      - name: Create Android project
        working-directory: mobile
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android
      - name: Verify v3 package
        run: grep -R "com.prombarjin.omegaenterprise.v3" mobile/android/app/src/main mobile/android/app/build.gradle
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Validate APK
        run: |
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.prombarjin.omegaenterprise.v3'"
      - uses: actions/upload-artifact@v4
        with:
          name: PROMBARJIN-OMEGA-ENTERPRISE-X-v3
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
